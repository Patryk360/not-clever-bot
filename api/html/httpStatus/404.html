<!DOCTYPE html>
<html lang="pl" class="h-100">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <title>404 - Nie znaleziono strony</title>
</head>
<body class="h-100 d-flex align-items-center justify-content-center" style="background-color: #f0f8ff;">
    <div class="text-center p-5 bg-white shadow rounded-4">
        <h1 class="display-1 fw-bold text-primary">404</h1>
        <h2 class="mb-3 text-dark">Strona nie istnieje</h2>
        <p class="text-muted mb-4"><%= err ? err.code : 'Wygląda na to, że zgubiłeś drogę.' %></p>
        <a href="/" class="btn btn-primary rounded-pill px-4">Wróć na główną</a>
    </div>
</body>
</html>
