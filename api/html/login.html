<!DOCTYPE html>
<html lang="pl" class="h-100">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="/bootstrap/css/bootstrap.min.css" rel="stylesheet">
        <link href="/css/login.css" rel="stylesheet">
        <link rel="icon" type="image/x-icon" href="/images/logo.png">
        <title>Logowanie - NotCleverBot</title>
    </head>
    <body class="h-100">
        <%- include('partials/navbar.html', { }); %>

        <div class="container flex-grow-1 d-flex flex-column justify-content-center">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-4 text-center login-card">
                    <img src="/images/logo.png" alt="Logo" width="80" class="mb-4 rounded-circle shadow-sm" onerror="this.style.display='none'">
                    <h2 class="mb-4 text-primary fw-bold">Witaj ponownie!</h2>
                    
                    <div class="mb-3 text-start">
                        <label for="username" class="form-label text-muted fw-semibold">Nazwa użytkownika</label>
                        <input type="text" class="form-control rounded-pill px-3" id="username" placeholder="Edziooo">
                    </div>

                    <div class="mb-4 text-start">
                        <label for="password" class="form-label text-muted fw-semibold">Hasło</label>
                        <input type="password" id="password" class="form-control rounded-pill px-3" placeholder="••••••••">
                    </div>

                    <button id="login" type="button" class="btn btn-primary w-100 rounded-pill py-2 fw-bold shadow-sm">Zaloguj się</button>
                    
                    <p class="mt-4 text-muted small">Nie masz konta? <a href="/dashboard/register" class="text-decoration-none">Zarejestruj się</a></p>
                </div>
            </div>
        </div>

        <%- include('partials/footer.html', {  }); %>

        <script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
        <script src="/jquery"></script>
        <script src="/js/main.js"></script>
        <script src="/js/login.js"></script>
    </body>
</html>
