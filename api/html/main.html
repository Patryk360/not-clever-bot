<!DOCTYPE html>
<html lang="pl" class="h-100">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="/bootstrap/css/bootstrap.min.css" rel="stylesheet">
        <link href="/css/main.css" rel="stylesheet">
        <link rel="icon" type="image/x-icon" href="/images/edward.png">
        <title>Główna - NotCleverBot</title>
    </head>
    <body class="h-100">
        <%- include('partials/navbar.html', { }); %>

        <div class="container flex-grow-1 d-flex flex-column justify-content-center py-4">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="card chat-card">
                        <div id="chat-box" class="d-flex flex-column">
                            <div class="message bot-msg">Cześć! Jestem gotowy do rozmowy. O co chcesz zapytać?</div>
                        </div>
                        <div class="input-group-custom d-flex">
                            <input type="text" id="user-input" class="form-control rounded-pill me-2" placeholder="Napisz wiadomość..." autocomplete="off" onkeypress="handleEnter(event)" style="border-color: #b3d7ff;">
                            <button id="send-btn" class="btn btn-primary rounded-pill px-4" onclick="sendMessage()">Wyślij</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <%- include('partials/footer.html', {  }); %>

        <script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
        <script src="/jquery"></script>
        <script src="/js/main.js"></script>
    </body>
</html>
