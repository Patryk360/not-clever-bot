<!DOCTYPE html>
<html lang="pl" class="h-100">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="/bootstrap/css/bootstrap.min.css" rel="stylesheet">
        <link href="/css/register.css" rel="stylesheet">
        <link rel="icon" type="image/x-icon" href="/images/logo.png">
        <title>Rejestracja - NotCleverBot</title>
        <style>
</style>
    </head>
    <body class="h-100">
        <%- include('partials/navbar.html', { }); %>

        <div class="container flex-grow-1 d-flex flex-column justify-content-center py-5">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-5 register-card">
                    <h2 class="mb-4 text-center text-primary fw-bold">Stwórz nowe konto</h2>
                    
                    <div class="mb-3">
                        <label for="usernameVal" class="form-label text-muted fw-semibold">Nazwa użytkownika</label>
                        <input type="text" class="form-control rounded-pill px-3" id="usernameVal" placeholder="Edziooo">
                    </div>

                    <div class="mb-3">
                        <label for="emailVal" class="form-label text-muted fw-semibold">Adres Email</label>
                        <input type="email" class="form-control rounded-pill px-3" id="emailVal" placeholder="edzio@clever.com">
                    </div>

                    <div class="mb-3">
                        <label for="passwordVal" class="form-label text-muted fw-semibold">Hasło</label>
                        <input type="password" id="passwordVal" class="form-control rounded-pill px-3" placeholder="••••••••">
                        <div id="passwordHelpBlock" class="form-text small text-muted mt-2 px-2">
                            Twoje hasło musi mieć od 8 do 20 znaków, zawierać litery i cyfry oraz nie może zawierać spacji, znaków specjalnych ani emotikonów.
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="retypePasswordVal" class="form-label text-muted fw-semibold">Powtórz Hasło</label>
                        <input type="password" id="retypePasswordVal" class="form-control rounded-pill px-3" placeholder="••••••••">
                        <div id="progress-bar" class="mt-2"></div>
                    </div>

                    <button id="register" type="button" class="btn btn-primary w-100 rounded-pill py-2 fw-bold shadow-sm">Zarejestruj się</button>
                    
                    <p class="mt-4 text-center text-muted small">Masz już konto? <a href="/dashboard/login" class="text-decoration-none">Zaloguj się</a></p>
                </div>
            </div>
        </div>

        <%- include('partials/footer.html', {  }); %>

        <script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
        <script src="/jquery"></script>
        <script src="/js/main.js"></script>
        <script src="/js/register.js"></script>
    </body>
</html>
